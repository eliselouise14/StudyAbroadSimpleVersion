<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>留学国家匹配测试</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:"PingFang SC","Microsoft YaHei",sans-serif;
}
body{
background:linear-gradient(135deg,#4facfe,#00c6fb);
padding:20px;
}
.container{
max-width:750px;
margin:auto;
background:white;
border-radius:20px;
padding:30px;
box-shadow:0 15px 40px rgba(0,0,0,.15);
}
h1{
text-align:center;
margin-bottom:10px;
}
.subtitle{
text-align:center;
color:#666;
margin-bottom:25px;
}
.progress{
height:10px;
background:#eee;
border-radius:20px;
overflow:hidden;
margin-bottom:25px;
}
.bar{
height:100%;
width:0%;
background:#4facfe;
transition:.3s;
}
.question{
display:none;
animation:fade .3s;
}
.question.active{
display:block;
}
@keyframes fade{
from{opacity:0;transform:translateY(10px);}
to{opacity:1;transform:translateY(0);}
}
.question h2{
font-size:22px;
margin-bottom:20px;
}
.option{
display:block;
padding:15px;
margin:10px 0;
border:2px solid #ddd;
border-radius:12px;
cursor:pointer;
transition:.2s;
}
.option:hover{
background:#f5fbff;
border-color:#4facfe;
}
input[type=radio]{
display:none;
}
input:checked+label{
background:#4facfe;
color:white;
border-color:#4facfe;
}
.buttons{
display:flex;
justify-content:space-between;
margin-top:25px;
}
button{
padding:12px 28px;
border:none;
border-radius:10px;
background:#4facfe;
color:white;
cursor:pointer;
font-size:16px;
}
button:disabled{
background:#ccc;
cursor:not-allowed;
}
.result{
display:none;
}
.rank{
margin:18px 0;
padding:15px;
border-radius:12px;
background:#f8f9ff;
}
.score{
height:10px;
background:#ddd;
border-radius:20px;
margin-top:8px;
overflow:hidden;
}
.score div{
height:100%;
background:#4facfe;
}
.country{
font-size:28px;
margin-bottom:10px;
}
.desc{
color:#555;
line-height:1.8;
}
</style>

</head>
<body>

<div class="container">

<h1>🌍 留学国家匹配测试</h1>
<p class="subtitle">10个问题，找到最适合你的留学目的地</p>

<div class="progress"><div class="bar" id="bar"></div></div>

<div id="quiz"></div>

<div class="buttons">
<button id="prev">上一题</button>
<button id="next">下一题</button>
</div>

<div class="result" id="result"></div>

</div>

<script>
const countries=["日本","英国","美国","加拿大","澳大利亚","德国","新加坡"];

const descriptions={
"日本":"适合喜欢亚洲文化、希望就业机会较多、生活便利的人。",
"英国":"适合希望快速完成学业、重视名校资源的人。",
"美国":"适合喜欢探索、创新和丰富校园生活的人。",
"加拿大":"适合重视移民机会、生活平衡的人。",
"澳大利亚":"适合喜欢阳光、户外生活和兼职机会的人。",
"德国":"适合预算有限、喜欢工程科技的人。",
"新加坡":"适合希望亚洲国际化环境、英语学习的人。"
};

const questions=[
{
q:"你的留学预算更接近？",
options:[
["每年10万以内",["德国","日本"]],
["10-20万",["日本","德国","新加坡"]],
["20-35万",["英国","加拿大"]],
["35万以上",["美国","澳大利亚"]]
]
},
{
q:"毕业后你最希望？",
options:[
["回国发展",["日本","英国"]],
["海外就业",["加拿大","澳大利亚"]],
["创业或科研",["美国","德国"]],
["国际企业工作",["新加坡","英国"]]
]
},
{
q:"你喜欢什么样的校园氛围？",
options:[
["传统安静",["英国","日本"]],
["自由开放",["美国"]],
["多元包容",["加拿大"]],
["国际都市",["新加坡"]]
]
},
{
q:"你愿意学习当地语言吗？",
options:[
["非常愿意",["日本","德国"]],
["愿意尝试",["加拿大","澳大利亚"]],
["希望英语即可",["英国","美国","新加坡"]],
["完全不想",["美国","英国"]]
]
},
{
q:"你最感兴趣的专业？",
options:[
["工程科技",["德国","美国"]],
["商科",["英国","新加坡"]],
["动漫设计",["日本"]],
["医学护理",["加拿大","澳大利亚"]]
]
},
{
q:"生活节奏偏好？",
options:[
["快节奏",["日本","新加坡"]],
["平衡",["加拿大","澳大利亚"]],
["充满机会",["美国"]],
["悠闲",["德国"]]
]
},
{
q:"最重视什么？",
options:[
["名校排名",["英国","美国"]],
["学费便宜",["德国"]],
["安全舒适",["日本","加拿大"]],
["就业率",["新加坡","澳大利亚"]]
]
},
{
q:"你喜欢什么气候？",
options:[
["四季分明",["日本","德国"]],
["温暖海边",["澳大利亚"]],
["寒冷雪景",["加拿大"]],
["城市气候",["英国","新加坡"]]
]
},
{
q:"兼职重要吗？",
options:[
["非常重要",["澳大利亚","加拿大"]],
["一般",["日本","英国"]],
["不太重要",["美国"]],
["以后工作更重要",["新加坡"]]
]
},
{
q:"你更向往哪种体验？",
options:[
["动漫与美食",["日本"]],
["历史古典",["英国"]],
["创新科技",["美国"]],
["自然风光",["加拿大","澳大利亚"]]
]
}
];

let current=0;
const answers=new Array(questions.length);

const quiz=document.getElementById("quiz");

questions.forEach((item,i)=>{
const div=document.createElement("div");
div.className="question"+(i===0?" active":"");
div.innerHTML=`<h2>${i+1}. ${item.q}</h2>`;
item.options.forEach((op,j)=>{
div.innerHTML+=`
<input type="radio" name="q${i}" id="q${i}_${j}" value="${j}">
<label class="option" for="q${i}_${j}">${op[0]}</label>`;
});
quiz.appendChild(div);
});

const qs=document.querySelectorAll(".question");
const bar=document.getElementById("bar");

function update(){
qs.forEach((q,i)=>q.classList.toggle("active",i===current));
bar.style.width=(current/questions.length*100)+"%";
document.getElementById("prev").disabled=current===0;
document.getElementById("next").innerText=current===questions.length-1?"查看结果":"下一题";
}

document.getElementById("prev").onclick=()=>{
current--;
update();
};

document.getElementById("next").onclick=()=>{
const checked=document.querySelector(`input[name=q${current}]:checked`);
if(!checked){alert("请选择一个答案");return;}
answers[current]=checked.value;

if(current===questions.length-1){
showResult();
}else{
current++;
update();
}
};

function showResult(){

const score={};
countries.forEach(c=>score[c]=0);

answers.forEach((ans,i)=>{
questions[i].options[ans][1].forEach(c=>score[c]+=1);
});

const sorted=Object.entries(score).sort((a,b)=>b[1]-a[1]);

document.querySelector(".buttons").style.display="none";
document.querySelector(".progress").style.display="none";
quiz.style.display="none";

const max=sorted[0][1];

let html=`<h1>🎉 测试结果</h1><br>`;

html+=`
<div class="country">最适合你的国家：🇨🇳➡️ ${sorted[0][0]}</div>
<p class="desc">${descriptions[sorted[0][0]]}</p><br>
`;

html+="<h2>你的匹配排行榜</h2>";

sorted.slice(0,3).forEach((c,index)=>{
const percent=Math.round(c[1]/max*100);
const emoji=["🥇","🥈","🥉"][index];
html+=`
<div class="rank">
<strong>${emoji} ${c[0]}</strong>
<div class="score"><div style="width:${percent}%"></div></div>
<small>${percent}%匹配</small>
</div>`;
});

html+=`
<br><button onclick="location.reload()">重新测试</button>
`;

const result=document.getElementById("result");
result.innerHTML=html;
result.style.display="block";

}
update();
</script>

</body>
</html>
